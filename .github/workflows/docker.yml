name: docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build; GITHUB_TOKEN is read-only there.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: |
            ghcr.io/navok85/pterodactyl-mcp:latest
            ghcr.io/navok85/pterodactyl-mcp:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dummy credentials: the server only needs a URL and one key to boot.
      - name: Smoke test image
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e PTERODACTYL_URL=https://panel.example.com \
            -e PTERODACTYL_APP_KEY=ptla_dummy \
            -e PTERODACTYL_CLIENT_KEY=ptlc_dummy \
            ghcr.io/navok85/pterodactyl-mcp:latest
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
          docker rm -f smoke
